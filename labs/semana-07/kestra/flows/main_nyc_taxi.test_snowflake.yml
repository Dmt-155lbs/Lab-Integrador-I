id: test_snowflake
namespace: nyc_taxi
description: |
  Fase 1b · Prueba de conexion Kestra -> Snowflake con el usuario de servicio
  (LAB_INT_SVC) y su llave RSA. Solo consulta funciones de contexto:
  no enciende el warehouse (0 creditos).

tasks:
  - id: whoami
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ envs.snowflake_user }}"
    privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
    role: "{{ envs.snowflake_role }}"
    warehouse: "{{ envs.snowflake_warehouse }}"
    database: "{{ envs.snowflake_database }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT CURRENT_USER()      AS usuario,
             CURRENT_ROLE()      AS rol,
             CURRENT_WAREHOUSE() AS warehouse,
             CURRENT_DATABASE()  AS base_de_datos

  - id: resultado
    type: io.kestra.plugin.core.log.Log
    message: "Conexion OK -> {{ outputs.whoami.row }}"